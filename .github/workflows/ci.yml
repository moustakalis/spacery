name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: "PHP: lint & analyse"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: PHP syntax check
        run: find spacery.php includes -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: PHPCS
        run: composer run lint

      - name: PHPStan
        run: composer run analyse

  js:
    name: "JS: lint, typecheck & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:js

      - name: Build
        run: pnpm run build

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Plugin Check inspects the distributed plugin, so it must run against
      # built assets rather than sources.
      - name: Build
        run: pnpm run build

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          slug: spacery
          build-dir: '.'
          wp-version: '7.1'
          exclude-directories: 'node_modules,vendor,tests,docs,assets'
