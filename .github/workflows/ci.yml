name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: "PHP: lint & analyse"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: PHP syntax check
        run: find spacery.php includes -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      # Versions that disagree ship an update WordPress never offers anyone, and
      # packaging lists that disagree put a file on WordPress.org that is absent
      # from the zip. Neither shows up until someone is looking at the directory
      # wondering what happened.
      - name: Release metadata agrees with itself
        run: python3 bin/check-release.py

      - name: PHPCS
        run: composer run lint

      - name: PHPStan
        run: composer run analyse

      - name: PHPUnit
        run: composer run test

      # Compares Spacery's generated media queries and boundary validation
      # against core's real WP_Theme_JSON, so a change in core fails here
      # rather than as a subtly wrong layout on somebody's site.
      - name: Fetch core source for contract tests
        run: composer run fetch-core

      - name: PHPUnit (core contract)
        run: composer run test:contract

  js:
    name: "JS: lint, typecheck & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:js

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build

  i18n:
    name: "i18n: POT is current"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install WP-CLI
        run: |
          curl -fsSL -o /tmp/wp-cli.phar \
            https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar

      # A string added without regenerating the POT is untranslatable and
      # nothing else would notice: the plugin works, the string is just stuck in
      # English forever. This is the only check that catches it.
      - name: Regenerate the POT
        run: WP_CLI=/tmp/wp-cli.phar pnpm run i18n:pot

      - name: Fail if it differs from the committed one
        run: |
          # POT-Creation-Date changes on every run and carries no information.
          undated='^"POT-Creation-Date:'
          git show HEAD:languages/spacery.pot | grep -v "$undated" > /tmp/committed.pot
          grep -v "$undated" languages/spacery.pot > /tmp/fresh.pot
          if ! diff -u /tmp/committed.pot /tmp/fresh.pot; then
            echo "::error::languages/spacery.pot is out of date. Run 'pnpm run i18n:pot'."
            exit 1
          fi

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Plugin Check must inspect the artifact that would be published, not the
      # repository. The repo root carries dev config the directory rejects:
      # dotfiles, .github, and *.dist files (a blocked "application file"
      # extension). `plugin-zip` packs only what package.json#files declares.
      - name: Build
        run: pnpm run build

      - name: Pack the distributable
        run: |
          pnpm run plugin-zip
          mkdir -p dist
          unzip -q spacery.zip -d dist
          echo "Distribution contents:"
          find dist -type f | sort

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          slug: spacery
          build-dir: ./dist/spacery
          wp-version: '7.1'

  e2e:
    name: "E2E: editor"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # wp-env needs Docker, which is why these cannot run outside CI.
      - name: Start WordPress
        run: pnpm run env:start

      - name: Run end-to-end tests
        run: pnpm run test:e2e

      # M6's exit criterion. The site is switched to Greek and both halves of the
      # translation pipeline are exercised: `wp eval` proves PHP loads the .mo
      # through WordPress's own just-in-time mechanism, and the Playwright spec
      # proves the browser loads the per-handle .json.
      - name: Switch the test site to Greek
        run: pnpm run env run tests-cli wp option update WPLANG el

      - name: A second locale renders (PHP)
        run: |
          pnpm run env run tests-cli wp eval 'echo __( "Save changes", "spacery" );' \
            | tee /tmp/translated.txt
          grep -q 'Αποθήκευση αλλαγών' /tmp/translated.txt

      - name: A second locale renders (editor and admin)
        run: pnpm exec playwright test --config playwright-locale.config.ts

      - name: Switch the test site back
        if: always()
        run: pnpm run env run tests-cli wp option update WPLANG '' || true

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: artifacts/
          retention-days: 7

      - name: WordPress logs on failure
        if: failure()
        run: pnpm run env logs tests --no-watch || true
