# Dependency build scripts, reviewed individually.
#
# pnpm 11 sets `strictDepBuilds: true` by default: an install fails if any
# dependency wants to run a lifecycle script that has not been explicitly
# reviewed. Each entry below records a decision, not a rubber stamp.
allowBuilds:
  # Native NAPI module behind eslint-import-resolver-typescript and
  # eslint-import-context. `pnpm run lint:js` does not resolve imports without it.
  unrs-resolver: true

  # Native filesystem-event binding used for watch mode (`wp-scripts start`).
  # Its install script fetches a prebuild and falls back to compiling.
  '@parcel/watcher': true

  # Native file locking for @php-wasm/node, which backs wp-env. Local
  # development only, but denying it breaks `pnpm run env:start`.
  fs-ext-extra-prebuilt: true

  # Denied: the postinstall is a funding message wrapped in try/catch
  # (`node -e "try{require('./postinstall')}catch(e){}"`). Nothing depends on
  # it running, and it cannot fail either way.
  core-js: false
  core-js-pure: false

# Transient: pnpm 11 refuses to resolve packages published in the last 24h.
# responsive-state@0.2.0 was published 2026-09-01T12:42Z, minutes before this
# lockfile was generated. Remove this key after 2026-09-02T12:42Z.
minimumReleaseAgeExclude:
  - responsive-state@0.2.0
